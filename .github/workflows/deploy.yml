name: Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main # Ubah ke 'master' jika default branch repo Anda adalah master

jobs:
  deploy:
    name: Deploy to FTP Hosting
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: satryobarber.web.id/htdocs/ # Sesuaikan folder di hosting Anda (biasanya public_html atau htdocs)
          # Daftar file atau folder yang tidak ingin ikut di-upload
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            vendor/**
            .env
            barber_db.sql
